[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "publication-lister"
version = "0.1.0"
description = "Academic Conference & Journal Affiliation Tracker across robotics and AI publication venues."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "google-genai>=0.1.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
affiliation-tracker = "main:cli"

